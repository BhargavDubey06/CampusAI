<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusAI – Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="theme-admin">
  <header class="top-nav" id="topNav">
    <div class="container inner">
      <a class="brand" href="index.html"><span class="brand-mark"><i data-lucide="graduation-cap" class="i"></i></span>CAMPUSAI</a>
      <nav class="links">
        <a href="index.html"><i data-lucide="house" class="i i-sm"></i>Home</a>
        <a href="chatbot.html"><i data-lucide="message-circle" class="i i-sm"></i>Chat</a>
        <a href="documents.html"><i data-lucide="library" class="i i-sm"></i>Documents</a>
        <a href="admin.html" class="active"><i data-lucide="layout-dashboard" class="i i-sm"></i>Admin</a>
        <a href="features.html"><i data-lucide="list-check" class="i i-sm"></i>Smart Features</a>
      </nav>
      <div class="right"><div data-user-area="nav"></div></div>
      <button class="icon-btn nav-toggle" aria-label="Toggle menu"><i data-lucide="menu" class="i i-sm"></i></button>
    </div>
  </header>

  <main class="container pb-5">
    <div class="page-head">
      <h1>Admin Dashboard</h1>
      <p>Manage documents, FAQs and feedback for your college assistant.</p>
    </div>
    <div id="adminRoot"></div>
  </main>

  <!-- FAQ modal -->
  <div class="modal fade" id="faqModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content c-modal">
    <form id="faqForm">
      <div class="modal-header"><h5 class="modal-title" id="faqModalTitle">Add FAQ</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <label class="c-label" for="faqQ">Question</label><input class="c-input mb-3" id="faqQ" maxlength="300" required>
        <label class="c-label" for="faqA">Answer</label><textarea class="c-textarea mb-3" id="faqA" rows="5" maxlength="3000" required></textarea>
        <label class="c-label" for="faqCat">Category</label><select class="c-select" id="faqCat"></select>
        <div class="form-error mt-2" id="faqErr"></div>
      </div>
      <div class="modal-footer"><button type="submit" class="btn-grad" id="faqSave">Save FAQ</button></div>
    </form>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
